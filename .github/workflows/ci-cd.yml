name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        shell: powershell
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is unavailable"
          }

      - name: Log in to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed"
          }

     
      
     
      - name: Diagnose Docker Hub secrets
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          Write-Host "Username secret present: $(-not [string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME))"
          Write-Host "Token secret present: $(-not [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN))"
          Write-Host "Docker executable:"
          Get-Command docker | Select-Object -ExpandProperty Source

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "Username secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Token secret is missing"
          }
