name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic Image
        run: docker build -t ionic-vue-app:latest .

      - name: Remove previous container
        run: docker rm -f ionic-vue-app
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-vue-app -p 8080:8080 ionic-vue-app:latest

      - name: Verify app
        shell: powershell
        run: |
          $Success = $false
          for ($i = 0; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8080 -UseBasicParsing -TimeoutSec 2 | Out-Null
              $Success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $Success) {
            docker logs ionic-vue-app
            exit 1
          }